# =============================================================================
# Freight Rate Prediction - central configuration
# =============================================================================
# Phase-3 audit finding TD-18: paths, column lists and split boundaries were
# previously hardcoded as string literals across several modules. They now live
# here so that a single edit changes behaviour everywhere.
# =============================================================================

project:
  name: freight-rate-prediction
  # Global seed. Audit finding C-12: EDAConfig declared `random_seed` but never
  # used it and no seed was set anywhere in the codebase.
  random_seed: 42

paths:
  # Raw inputs (tracked in git). Names follow the assessment brief and score.py.
  data_dir: data
  train: data/train_test.csv
  validation: data/validation.csv
  predictions_template: data/validation_predictions_template.csv
  december_inputs: data/december_chart_inputs.csv

  # Derived outputs (git-ignored).
  processed_dir: processed
  models_dir: models
  reports_dir: reports
  figures_dir: figures

columns:
  id: load_id
  target: posted_rate
  date: date
  categorical:
    - pickup
    - delivery
    - equipment
  # Raw numeric columns as they appear in train_test.csv / validation.csv.
  numeric:
    - pickup_lat
    - pickup_lon
    - delivery_lat
    - delivery_lon
    - distance
    - weight
    - market_index
    - quote_signal
  # Columns absent from data/december_chart_inputs.csv. The December inference
  # path must reconstruct these; see `inference.py`.
  #   - coordinates  -> deterministic city lookup (verified 1 coord pair / city)
  #   - market context -> daily lookup table built from validation.csv
  december_absent:
    - pickup_lat
    - pickup_lon
    - delivery_lat
    - delivery_lon
    - market_index
    - quote_signal

cleaning:
  # Audit finding M-3: 292 training rows carry negative `weight`. abs(negative)
  # is distributionally identical to the positive population (mean 31,724 vs
  # 31,415; identical [5000, 47500] support), which identifies this as a
  # sign-flip data-entry corruption rather than a distinct population.
  weight_sign_repair: abs
  weight_min: 5000.0
  weight_max: 47500.0

  # Missing-value strategy. Missingness is low (weight 0.63%, market_index
  # 0.78% in train) but non-zero and *higher* in validation (1.38% / 2.08%),
  # so the fact of missingness is retained as an explicit indicator.
  numeric_impute_strategy: median
  missing_indicator_columns:
    - weight
    - market_index

features:
  temporal:
    # Audit finding M-1: train covers 2025-01-01..2025-10-31, validation covers
    # 2025-11-01..2025-12-31. `date_year` is constant (2025) and raw
    # `date_month` is out-of-range at inference ({11,12} vs {1..10} in train).
    # Both are replaced by cyclical encodings that are continuous across the
    # year boundary and never leave the training support.
    reference_date: "2025-01-01"
    use_cyclical_day_of_year: true
    use_cyclical_day_of_week: true
    use_is_weekend: true
    use_days_since_reference: false  # monotone -> extrapolates; disabled.
  geospatial:
    # Verified: corr(distance, posted_rate) = 0.909 and city -> lat/lon is
    # deterministic (exactly one coordinate pair per city).
    use_haversine: true
    use_bearing: true
    use_lon_delta: true   # corr(delivery_lon, rate) = -0.257 (westbound premium)
    use_lat_delta: true
  interactions:
    use_weight_per_mile: true
    use_log_distance: true
    # Equipment rate-per-mile multipliers vs Dry Van (verified): Flatbed 1.085,
    # Reefer 1.127. Captured by the categorical encoder, not duplicated here.

encoding:
  # Audit finding M-6: 131 one-hot columns against 11 real numeric features
  # (92% sparse indicators). Retained for Phase 3 because it is model-agnostic
  # and leakage-free; Phase 5 may switch to native categorical handling.
  categorical_strategy: onehot
  handle_unknown: ignore
  # Audit finding M-4: validation contains 8 cities absent from train
  # (Allentown, Charlotte, Chicago, Jackson, Knoxville, Laredo, Norfolk,
  # San Diego) affecting ~6% of validation rows.
  #
  # `min_frequency` bucketing was measured and rejected: a threshold low enough
  # to exist at all (0.01 = 480 rows) collapses 14 of 64 real cities into an
  # "infrequent" bucket, destroying their identity to catch unknowns. Instead
  # `handle_unknown: ignore` is kept (unseen -> all-zero one-hot) and the
  # unknown state is made explicit via a dedicated indicator column, so the
  # model can distinguish "unseen city" from "no city". Geography for those
  # rows is carried by the coordinate/haversine/bearing features, which are
  # fully informative regardless of whether the city was seen in training.
  min_frequency: null
  unknown_category_indicator: true

scaling:
  weight_scaler: robust     # heavy-tailed after sign repair
  default_scaler: standard

split:
  # Audit finding M-1 / R-3: a random split would score the model on
  # interpolation while the real task is forward extrapolation. The holdout is
  # therefore the final contiguous block of the training window, mirroring the
  # real train -> validation gap.
  strategy: temporal
  holdout_start: "2025-09-01"   # train <= 2025-08-31, holdout Sep-Oct 2025
  n_cv_splits: 5
